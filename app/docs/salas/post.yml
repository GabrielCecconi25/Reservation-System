tags:
  - Salas
summary: Criar uma nova sala
description: Cria uma nova sala com número e descrição.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          numero:
            type: string
            example: "101"
          descricao:
            type: string
            example: "Laboratório"
responses:
  201:
    description: Sala criada com sucesso
  400:
    description: Requisição inválida
  409:
    description: Conflito de reserva horario ja reservado
