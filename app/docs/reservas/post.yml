post:
  tags:
    - Reservas
  summary: Criar reserva de sala
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            id_sala:
              type: integer
              example: 1
            id_turma:
              type: integer
              example: 2
            data_reserva:
              type: string
              format: date
              example: "2025-06-01"
            hora_inicio:
              type: string
              example: "09:00"
            hora_fim:
              type: string
              example: "10:00"
  responses:
    201:
      description: Reserva criada com sucesso
    400:
      description: Erro de validação
